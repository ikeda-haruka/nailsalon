<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 背景グラデーション（白・淡い紫・シャンパンゴールド） -->
    <radialGradient id="emblemBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F5EEF8"/>
      <stop offset="90%" stop-color="#EDE2F4"/>
      <stop offset="100%" stop-color="#F5EDDE"/>
    </radialGradient>

    <!-- シャンパンゴールド グラデーション -->
    <linearGradient id="emblemGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="35%" stop-color="#F5E8BA"/>
      <stop offset="70%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#E8CA7B"/>
    </linearGradient>

    <!-- 淡いパープルグラデーション -->
    <linearGradient id="emblemLavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9370DB"/>
      <stop offset="50%" stop-color="#7B4B94"/>
      <stop offset="100%" stop-color="#4A235A"/>
    </linearGradient>

    <!-- ソフトグロー -->
    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 円形背景パネル -->
  <circle cx="100" cy="100" r="96" fill="url(#emblemBgGrad)" stroke="url(#emblemGoldGrad)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#emblemGoldGrad)" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.8"/>

  <!-- 5枚の苺の花弁（Fraise: 尊重・愛情・先見の明）幾何学シンボル -->
  <g transform="translate(100, 100)">
    <g fill="none" stroke="url(#emblemGoldGrad)" stroke-width="1.6" stroke-opacity="0.95">
      <!-- 5つの花びらループ -->
      <path d="M 0,-60 C 18,-60 32,-42 26,-23 C 18,-5 0,0 0,0 C 0,0 -18,-5 -26,-23 C -32,-42 -18,-60 0,-60 Z" fill="#FAF5FC" fill-opacity="0.85"/>
      <path d="M 0,-60 C 18,-60 32,-42 26,-23 C 18,-5 0,0 0,0 C 0,0 -18,-5 -26,-23 C -32,-42 -18,-60 0,-60 Z" transform="rotate(72)" fill="#FAF5FC" fill-opacity="0.85"/>
      <path d="M 0,-60 C 18,-60 32,-42 26,-23 C 18,-5 0,0 0,0 C 0,0 -18,-5 -26,-23 C -32,-42 -18,-60 0,-60 Z" transform="rotate(144)" fill="#FAF5FC" fill-opacity="0.85"/>
      <path d="M 0,-60 C 18,-60 32,-42 26,-23 C 18,-5 0,0 0,0 C 0,0 -18,-5 -26,-23 C -32,-42 -18,-60 0,-60 Z" transform="rotate(216)" fill="#FAF5FC" fill-opacity="0.85"/>
      <path d="M 0,-60 C 18,-60 32,-42 26,-23 C 18,-5 0,0 0,0 C 0,0 -18,-5 -26,-23 C -32,-42 -18,-60 0,-60 Z" transform="rotate(288)" fill="#FAF5FC" fill-opacity="0.85"/>
    </g>

    <!-- パラジェル＆水光マグネットのコアシンボル（ダイヤモンドスター） -->
    <circle cx="0" cy="0" r="16" fill="url(#emblemGoldGrad)" filter="url(#emblemGlow)"/>
    <circle cx="0" cy="0" r="12" fill="#FFFFFF"/>
    <polygon points="0,-14 3.5,-3.5 14,0 3.5,3.5 0,14 -3.5,3.5 -14,0 -3.5,-3.5" fill="url(#emblemGoldGrad)"/>
    
    <!-- 内周アクセントリング -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#emblemGoldGrad)" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.7"/>
  </g>
</svg>
