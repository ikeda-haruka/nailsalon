<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- 背景グラデーション（白・淡い紫・シャンパンゴールド） -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9FD"/>
      <stop offset="45%" stop-color="#F3EBF7"/>
      <stop offset="80%" stop-color="#EBE2F1"/>
      <stop offset="100%" stop-color="#F7F1E5"/>
    </linearGradient>

    <!-- シャンパンゴールド グラデーション -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="30%" stop-color="#F3E5AB"/>
      <stop offset="70%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#E6C875"/>
    </linearGradient>

    <!-- 淡いパープルグラデーション -->
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9370DB"/>
      <stop offset="50%" stop-color="#7B4B94"/>
      <stop offset="100%" stop-color="#4A235A"/>
    </linearGradient>

    <!-- ソフトシャドウ -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景パネル -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)"/>
  
  <!-- 外枠装飾（ゴールドの繊細な二重枠） -->
  <rect x="24" y="24" width="452" height="452" rx="32" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="32" y="32" width="436" height="436" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.5"/>

  <!-- 四隅のゴールドコーナーアクセント -->
  <circle cx="48" cy="48" r="3" fill="url(#goldGrad)"/>
  <circle cx="452" cy="48" r="3" fill="url(#goldGrad)"/>
  <circle cx="48" cy="452" r="3" fill="url(#goldGrad)"/>
  <circle cx="452" cy="452" r="3" fill="url(#goldGrad)"/>

  <!-- 中央のサークルエンブレム -->
  <g transform="translate(250, 195)">
    <!-- 外周の光彩サークル -->
    <circle cx="0" cy="0" r="105" fill="#FFFFFF" fill-opacity="0.85" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="97" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.8"/>
    
    <!-- 苺の花弁（5枚の花びら：尊重・愛情・先見の明）を抽象化した幾何学アート -->
    <g fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.9">
      <!-- 5つの花びらループ -->
      <path d="M 0,-65 C 20,-65 35,-45 28,-25 C 20,-5 0,0 0,0 C 0,0 -20,-5 -28,-25 C -35,-45 -20,-65 0,-65 Z" fill="#F8F3FA" fill-opacity="0.7"/>
      <path d="M 0,-65 C 20,-65 35,-45 28,-25 C 20,-5 0,0 0,0 C 0,0 -20,-5 -28,-25 C -35,-45 -20,-65 0,-65 Z" transform="rotate(72)" fill="#F8F3FA" fill-opacity="0.7"/>
      <path d="M 0,-65 C 20,-65 35,-45 28,-25 C 20,-5 0,0 0,0 C 0,0 -20,-5 -28,-25 C -35,-45 -20,-65 0,-65 Z" transform="rotate(144)" fill="#F8F3FA" fill-opacity="0.7"/>
      <path d="M 0,-65 C 20,-65 35,-45 28,-25 C 20,-5 0,0 0,0 C 0,0 -20,-5 -28,-25 C -35,-45 -20,-65 0,-65 Z" transform="rotate(216)" fill="#F8F3FA" fill-opacity="0.7"/>
      <path d="M 0,-65 C 20,-65 35,-45 28,-25 C 20,-5 0,0 0,0 C 0,0 -20,-5 -28,-25 C -35,-45 -20,-65 0,-65 Z" transform="rotate(288)" fill="#F8F3FA" fill-opacity="0.7"/>
    </g>

    <!-- 中央のパラジェル＆水光マグネットのコアシンボル（ダイヤモンドスター） -->
    <circle cx="0" cy="0" r="18" fill="url(#goldGrad)" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#goldGrad)"/>

    <!-- モノグラム SF (Salon de Fraise) -->
    <text x="0" y="55" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="14" fill="#6B3A7D" text-anchor="middle" font-weight="600" letter-spacing="4">
      PARAGEL TOKYO
    </text>
  </g>

  <!-- ブランド名テキスト -->
  <g text-anchor="middle">
    <text x="250" y="345" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Georgia', serif" font-size="28" font-weight="600" fill="#3D1D4A" letter-spacing="3">
      Salon de Fraise
    </text>

    <!-- サブタイトル -->
    <text x="250" y="375" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#8B6B99" letter-spacing="6">
      OMOTESANDO
    </text>

    <!-- 仕切りライン -->
    <line x1="170" y1="395" x2="330" y2="395" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.8"/>
    <polygon points="250,392 254,395 250,398 246,395" fill="url(#goldGrad)"/>

    <!-- 公式プロダクト表記 -->
    <text x="250" y="425" font-family="'Cinzel', 'Georgia', serif" font-size="10" font-weight="500" fill="#C59B27" letter-spacing="3">
      OFFICIAL SALON PRODUCTS
    </text>
    <text x="250" y="445" font-family="'Helvetica Neue', sans-serif" font-size="9" font-weight="300" fill="#9980A5" letter-spacing="1.5">
      自爪を削らないパラジェル ＆ 50種水光マグネット
    </text>
  </g>
</svg>
