<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 背景ダークグラデーション -->
    <radialGradient id="hommeBg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- プラチナ＆チタンシルバーグラデーション -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- シャイン効果 -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景パネル -->
  <rect width="800" height="600" fill="url(#hommeBg)"/>

  <!-- モードグリッド背景（繊細なドット） -->
  <pattern id="dotPattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#27272a" fill-opacity="0.6"/>
  </pattern>
  <rect width="800" height="600" fill="url(#dotPattern)"/>

  <!-- 幾何学外枠フレーム -->
  <rect x="30" y="30" width="740" height="540" rx="16" fill="none" stroke="url(#silverGrad)" stroke-width="1.2" stroke-opacity="0.4"/>
  <rect x="42" y="42" width="716" height="516" rx="10" fill="none" stroke="#3f3f46" stroke-width="0.8" stroke-dasharray="6 6" stroke-opacity="0.6"/>

  <!-- 四隅のチタンドット -->
  <circle cx="30" cy="30" r="3" fill="#E2E8F0"/>
  <circle cx="770" cy="30" r="3" fill="#E2E8F0"/>
  <circle cx="30" cy="570" r="3" fill="#E2E8F0"/>
  <circle cx="770" cy="570" r="3" fill="#E2E8F0"/>

  <!-- 中央上部：メンズエンブレムマーク -->
  <g transform="translate(400, 210)">
    <!-- 外周リング -->
    <circle cx="0" cy="0" r="84" fill="#18181b" stroke="url(#silverGrad)" stroke-width="2.5" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="url(#silverGrad)" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.7"/>

    <!-- 5枚の幾何学花弁（モノトーンHOMME仕様） -->
    <g fill="none" stroke="url(#silverGrad)" stroke-width="1.8" stroke-opacity="0.95">
      <path d="M 0,-52 C 16,-52 28,-36 22,-20 C 16,-4 0,0 0,0 C 0,0 -16,-4 -22,-20 C -28,-36 -16,-52 0,-52 Z" fill="#27272a" fill-opacity="0.9"/>
      <path d="M 0,-52 C 16,-52 28,-36 22,-20 C 16,-4 0,0 0,0 C 0,0 -16,-4 -22,-20 C -28,-36 -16,-52 0,-52 Z" transform="rotate(72)" fill="#27272a" fill-opacity="0.9"/>
      <path d="M 0,-52 C 16,-52 28,-36 22,-20 C 16,-4 0,0 0,0 C 0,0 -16,-4 -22,-20 C -28,-36 -16,-52 0,-52 Z" transform="rotate(144)" fill="#27272a" fill-opacity="0.9"/>
      <path d="M 0,-52 C 16,-52 28,-36 22,-20 C 16,-4 0,0 0,0 C 0,0 -16,-4 -22,-20 C -28,-36 -16,-52 0,-52 Z" transform="rotate(216)" fill="#27272a" fill-opacity="0.9"/>
      <path d="M 0,-52 C 16,-52 28,-36 22,-20 C 16,-4 0,0 0,0 C 0,0 -16,-4 -22,-20 C -28,-36 -16,-52 0,-52 Z" transform="rotate(288)" fill="#27272a" fill-opacity="0.9"/>
    </g>

    <!-- 中央のプラチナスター -->
    <circle cx="0" cy="0" r="14" fill="url(#silverGrad)"/>
    <circle cx="0" cy="0" r="10" fill="#09090b"/>
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="url(#silverGrad)"/>
  </g>

  <!-- タイトル・タイポグラフィ -->
  <!-- サブヘッダー -->
  <text x="400" y="345" font-family="'Cormorant Garamond', serif, sans-serif" font-size="14" letter-spacing="8" fill="#94A3B8" text-anchor="middle" font-weight="600">
    MEN'S PARAGEL NAIL SALON
  </text>

  <!-- メインブランド名 -->
  <text x="400" y="395" font-family="'Cormorant Garamond', 'Shippori Mincho', serif" font-size="44" letter-spacing="3" fill="#FFFFFF" text-anchor="middle" font-weight="400">
    Salon de Fraise <tspan fill="#CBD5E1" font-weight="300">HOMME</tspan>
  </text>

  <!-- ロケーション -->
  <text x="400" y="425" font-family="'Cormorant Garamond', sans-serif" font-size="16" letter-spacing="10" fill="#A1A1AA" text-anchor="middle" font-weight="500">
    OMOTESANDO
  </text>

  <!-- 区切り線 -->
  <line x1="280" y1="448" x2="520" y2="448" stroke="url(#shineGrad)" stroke-width="1.2"/>

  <!-- キャッチコピー -->
  <text x="400" y="482" font-family="'Shippori Mincho', 'Noto Serif JP', serif" font-size="17" letter-spacing="4" fill="#F4F4F5" text-anchor="middle" font-weight="400">
    自爪を削らないパラジェル ＆ 完全個室サロン
  </text>

  <!-- 特徴バッジ -->
  <text x="400" y="515" font-family="'Noto Sans JP', sans-serif" font-size="12" letter-spacing="2" fill="#71717A" text-anchor="middle">
    ALL MALE NAILISTS 5名在籍  |  自爪風マット仕上げ  |  提携メンズ専用
  </text>
</svg>
