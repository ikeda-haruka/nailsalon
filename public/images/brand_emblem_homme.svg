<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 背景グラデーション（ディープブラック・ダークチャコール） -->
    <radialGradient id="hommeBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="65%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- チタンシルバー・クローム グラデーション -->
    <linearGradient id="hommeSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#D1D5DB"/>
      <stop offset="70%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>

    <!-- ソフトグロー -->
    <filter id="hommeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 円形背景パネル -->
  <circle cx="100" cy="100" r="96" fill="url(#hommeBgGrad)" stroke="url(#hommeSilverGrad)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#hommeSilverGrad)" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.6"/>

  <!-- 5枚の幾何学花弁（モノトーンHOMME仕様） -->
  <g transform="translate(100, 100)">
    <g fill="none" stroke="url(#hommeSilverGrad)" stroke-width="1.6" stroke-opacity="0.95">
      <!-- 5つの花びらループ -->
      <path d="M 0,-60 C 18,-60 32,-42 26,-23 C 18,-5 0,0 0,0 C 0,0 -18,-5 -26,-23 C -32,-42 -18,-60 0,-60 Z" fill="#27272a" fill-opacity="0.9"/>
      <path d="M 0,-60 C 18,-60 32,-42 26,-23 C 18,-5 0,0 0,0 C 0,0 -18,-5 -26,-23 C -32,-42 -18,-60 0,-60 Z" transform="rotate(72)" fill="#27272a" fill-opacity="0.9"/>
      <path d="M 0,-60 C 18,-60 32,-42 26,-23 C 18,-5 0,0 0,0 C 0,0 -18,-5 -26,-23 C -32,-42 -18,-60 0,-60 Z" transform="rotate(144)" fill="#27272a" fill-opacity="0.9"/>
      <path d="M 0,-60 C 18,-60 32,-42 26,-23 C 18,-5 0,0 0,0 C 0,0 -18,-5 -26,-23 C -32,-42 -18,-60 0,-60 Z" transform="rotate(216)" fill="#27272a" fill-opacity="0.9"/>
      <path d="M 0,-60 C 18,-60 32,-42 26,-23 C 18,-5 0,0 0,0 C 0,0 -18,-5 -26,-23 C -32,-42 -18,-60 0,-60 Z" transform="rotate(288)" fill="#27272a" fill-opacity="0.9"/>
    </g>

    <!-- パラジェル＆ダイヤモンドスター（プラチナシルバー） -->
    <circle cx="0" cy="0" r="16" fill="url(#hommeSilverGrad)" filter="url(#hommeGlow)"/>
    <circle cx="0" cy="0" r="12" fill="#09090b"/>
    <polygon points="0,-14 3.5,-3.5 14,0 3.5,3.5 0,14 -3.5,3.5 -14,0 -3.5,-3.5" fill="url(#hommeSilverGrad)"/>

    <!-- 内周アクセントリング -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#hommeSilverGrad)" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.5"/>
  </g>
</svg>
